services:
  - type: web
    name: it-taskmanager
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "25"
      - key: DB_POOL_MIN
        value: "4"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "20000"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "30000"
      - key: RATE_LIMIT_MAX
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: FRONTEND_URL
        value: "https://it-taskmanager.onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_GROUP_CHAT_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: "Tharun4743/IT_taskmanager"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:vsbecitc2428@gmail.com"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: "vsbecitc2428@gmail.com"
      - key: BREVO_SENDER_NAME
        value: "VSBEC IT Department"
